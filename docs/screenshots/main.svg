<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Copyright © 2026 smart-car-software. GPL-3.0-or-later.
       Mock-up of the top of MainActivity on the head unit: today's suggestions as buttons and the
       status lines under them. Not a screenshot: the places and counts are made up. -->
  <title>Главный экран «Куда поехать»</title>
  <rect width="1600" height="600" rx="18" fill="#15171C"/>

  <text x="40" y="66" font-size="34" font-weight="700" fill="#F2F5F8">Куда поехать</text>
  <g font-size="19" fill="#9AA4B0">
    <text x="40" y="102">Когда машина заводится, на приборке появляется «Куда едем?»: события календаря, места, куда вы обычно ездите в это время, дом или работа.</text>
    <text x="40" y="128">Колёсико громкости — выбрать, ⏯ — построить маршрут в Навигаторе. Поездки запоминаются сами и остаются в машине.</text>
  </g>

  <text x="40" y="180" font-size="28" font-weight="700" fill="#F2F5F8">Куда едем?</text>
  <g font-size="23" fill="#F2F5F8" text-anchor="middle">
    <rect x="40" y="196" width="1520" height="54" rx="8" fill="#2E333B"/>
    <text x="800" y="231">Ужин · 18:00</text>
    <rect x="40" y="260" width="1520" height="54" rx="8" fill="#2E333B"/>
    <text x="800" y="295">Ice Power · по вторникам</text>
    <rect x="40" y="324" width="1520" height="54" rx="8" fill="#2E333B"/>
    <text x="800" y="359">Домой</text>
  </g>

  <g font-size="22" fill="#F2F5F8">
    <text x="40" y="420">✓ Всплывашки на приборке: Car Notification Service</text>
    <text x="40" y="452">✓ Яндекс Навигатор найден</text>
    <text x="40" y="484">✓ Поездки записываются: 214</text>
    <text x="40" y="516">✓ Яндекс: закладок 12, Дом ✓, Работа ✓ (обновлено 2 часа назад)</text>
  </g>
  <rect x="40" y="532" width="1520" height="54" rx="8" fill="#2E333B"/>
  <text x="800" y="567" font-size="23" fill="#F2F5F8" text-anchor="middle">Предложить сейчас</text>
</svg>
